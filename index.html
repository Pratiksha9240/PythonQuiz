<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Master Quest</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .easy { background: #065f46; color: #34d399; }
        .medium { background: #854d0e; color: #fde047; }
        .hard { background: #991b1b; color: #fca5a5; }

        .score-board {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .question-box {
            margin-bottom: 25px;
        }

        .taxonomy-tag {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        pre {
            background-color: #090d16;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-blue);
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #334155;
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: #475569;
            border-color: var(--accent-blue);
        }

        .option-btn.correct {
            background-color: var(--accent-green) !important;
            color: #000;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: var(--accent-red) !important;
            color: #fff;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover {
            background-color: #7dd3fc;
        }

        .results {
            text-align: center;
        }

        .results h2 {
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz">
    <div class="header">
        <span id="level-badge" class="badge easy">Easy</span>
        <div class="score-board">XP: <span id="score">0</span></div>
    </div>

    <div id="quiz-body">
        <div class="question-box">
            <div id="taxonomy" class="taxonomy-tag">Bloom's: Remembering</div>
            <div id="question" class="question-text">Loading question...</div>
            <div id="code-snippet"></div>
        </div>

        <div id="options" class="options-container"></div>

        <div class="controls">
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">Next Quest →</button>
        </div>
    </div>

    <div id="results-body" class="results" style="display: none;">
        <h2>Assessment Complete!</h2>
        <p>Final Score: <span id="final-score">0</span> / 600 XP</p>
        <div id="feedback" style="margin-top: 20px; line-height: 1.6;"></div>
        <button onclick="location.reload()" class="next-btn" style="display: inline-block; margin-top: 20px;">Restart Assessment</button>
    </div>
</div>

<script>
const quizData = [
    // EASY LEVEL (Remembering & Understanding)
    {
        level: "easy",
        taxonomy: "Bloom's: Remembering",
        question: "What will be the data type of the variable `x` after this line runs?",
        code: "x = input('Enter your age: ')",
        options: ["integer", "string", "float", "boolean"],
        correct: 1,
        points: 50
    },
    {
        level: "easy",
        taxonomy: "Bloom's: Understanding",
        question: "How many times will this `for` loop execute?",
        code: "for i in range(2, 8):\n    print(i)",
        options: ["8 times", "7 times", "6 times", "5 times"],
        correct: 2,
        points: 50
    },

    // MEDIUM LEVEL (Applying)
    {
        level: "medium",
        taxonomy: "Bloom's: Applying",
        question: "What will be printed to the console when this script runs?",
        code: "total = 0\nfor k in range(1, 5):\n    if k % 2 == 0:\n        total += k\nprint(total)",
        options: ["10", "6", "4", "12"],
        correct: 1,
        points: 100
    },
    {
        level: "medium",
        taxonomy: "Bloom's: Applying",
        question: "What is the final value of `count` after the while loop finishes?",
        code: "count = 10\nwhile count > 3:\n    count -= 3\nprint(count)",
        options: ["3", "1", "0", "10"],
        correct: 1,
        points: 100
    },

    // ADVANCED LEVEL (Analyzing & Evaluating)
    {
        level: "hard",
        taxonomy: "Bloom's: Analyzing",
        question: "Which input value for `n` will cause an infinite loop?",
        code: "n = int(input())\nwhile n != 0:\n    if n % 2 == 0:\n        n = n // 2\n    else:\n        n = n + 2",
        options: ["n = 8", "n = 4", "n = 3", "n = 0"],
        correct: 2,
        points: 150
    },
    {
        level: "hard",
        taxonomy: "Bloom's: Evaluating",
        question: "What is the exact output of this nested logic?",
        code: "x = 5\ny = 0\nwhile x > 2:\n    for i in range(x):\n        y += 1\n    x -= 2\nprint(y)",
        options: ["9", "8", "5", "12"],
        correct: 1,
        points: 150
    }
];

let currentQ = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const q = quizData[currentQ];
    
    // Update Badge & Header
    const badge = document.getElementById("level-badge");
    badge.innerText = q.level;
    badge.className = `badge ${q.level}`;
    
    document.getElementById("taxonomy").innerText = q.taxonomy;
    document.getElementById("question").innerText = q.question;
    
    // Render Code Snippet if exists
    const codeContainer = document.getElementById("code-snippet");
    if (q.code) {
        codeContainer.innerHTML = `<pre><code>${escapeHtml(q.code)}</code></pre>`;
    } else {
        codeContainer.innerHTML = "";
    }

    // Render Options
    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";
    
    q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx, btn);
        optionsContainer.appendChild(btn);
    });

    document.getElementById("next-btn").style.display = "none";
}

function selectOption(index, btnElement) {
    if (answered) return;
    answered = true;

    const q = quizData[currentQ];
    const buttons = document.querySelectorAll(".option-btn");

    if (index === q.correct) {
        btnElement.classList.add("correct");
        score += q.points;
        document.getElementById("score").innerText = score;
    } else {
        btnElement.classList.add("wrong");
        buttons[q.correct].classList.add("correct");
    }

    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentQ++;
    if (currentQ < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-body").style.display = "none";
    document.getElementById("results-body").style.display = "block";
    document.getElementById("final-score").innerText = score;

    let evalText = "";
    if (score >= 500) {
        evalText = "<strong>Exceptional Understanding:</strong> Strong grip on execution order, loop bounds, and variable mutations. Ready for advanced topics like data structures (Lists) and functions.";
    } else if (score >= 300) {
        evalText = "<strong>Solid Foundation:</strong> Understands core syntax and basic loop mechanics, but struggles slightly with complex state tracing (nested conditions/loops).";
    } else {
        evalText = "<strong>Gaps Identified:</strong> Needs reinforcement on loop execution limits, type casting from input, and step-by-step code tracing.";
    }

    document.getElementById("feedback").innerHTML = evalText;
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Initial Load
loadQuestion();
</script>
</body>
</html>
