<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pygame Images Quiz</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #101322;
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 92%;
        max-width: 900px;
        background: #191d32;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    .screen {
        display: none;
    }

    .screen.active {
        display: block;
    }

    .start-screen {
        text-align: center;
        padding: 50px 20px;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 15px;
        color: #ffd166;
    }

    h2 {
        color: #ffd166;
        margin-bottom: 20px;
    }

    .subtitle {
        color: #b8bdd6;
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 14px 25px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .start-btn {
        background: #ffd166;
        color: #151515;
        font-size: 20px;
        padding: 16px 40px;
    }

    button:hover {
        transform: scale(1.03);
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        gap: 15px;
    }

    .progress {
        color: #aeb4d0;
        font-size: 16px;
    }

    .score {
        color: #ffd166;
        font-weight: bold;
    }

    .timer-box {
        margin-bottom: 25px;
    }

    .timer-text {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-weight: bold;
    }

    .timer {
        color: #7ee7c4;
    }

    .timer.danger {
        color: #ff6b6b;
    }

    .timer-bar {
        width: 100%;
        height: 9px;
        background: #30354f;
        border-radius: 10px;
        overflow: hidden;
    }

    .timer-fill {
        height: 100%;
        width: 100%;
        background: #7ee7c4;
        transition: width 1s linear;
    }

    .timer-fill.danger {
        background: #ff6b6b;
    }

    .question {
        font-size: 23px;
        line-height: 1.5;
        margin-bottom: 25px;
    }

    .code {
        background: #0b0e18;
        border: 1px solid #343a59;
        border-radius: 12px;
        padding: 18px;
        margin: 15px 0 25px;
        font-family: Consolas, monospace;
        font-size: 16px;
        line-height: 1.6;
        white-space: pre-wrap;
        color: #e8ebff;
        overflow-x: auto;
    }

    .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .option {
        background: #252a43;
        color: white;
        text-align: left;
        border: 2px solid transparent;
        min-height: 65px;
        font-size: 16px;
    }

    .option:hover {
        background: #303652;
        border-color: #7ee7c4;
    }

    .option.correct {
        background: #174d3e;
        border-color: #7ee7c4;
    }

    .option.wrong {
        background: #562d36;
        border-color: #ff6b6b;
    }

    .feedback {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        background: #252a43;
        color: #cbd0e7;
        display: none;
        line-height: 1.5;
    }

    .next-btn {
        margin-top: 20px;
        background: #7ee7c4;
        color: #101322;
        display: none;
    }

    .result-screen {
        text-align: center;
        padding: 40px 20px;
    }

    .result-score {
        font-size: 55px;
        color: #ffd166;
        font-weight: bold;
        margin: 20px 0;
    }

    .result-message {
        color: #b8bdd6;
        font-size: 19px;
        margin-bottom: 30px;
    }

    .restart-btn {
        background: #ffd166;
        color: #151515;
    }

    @media (max-width: 700px) {
        .options {
            grid-template-columns: 1fr;
        }

        h1 {
            font-size: 32px;
        }

        .question {
            font-size: 20px;
        }

        .container {
            padding: 20px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- START SCREEN -->
    <div id="startScreen" class="screen active start-screen">
        <h1>🖼️ Pygame Images Quiz</h1>

        <p class="subtitle">
            Test your understanding of loading, resizing and displaying
            images in Pygame.
            <br><br>
            15 Questions • 25 Seconds Each
        </p>

        <button class="start-btn" onclick="startQuiz()">
            Start Quiz
        </button>
    </div>


    <!-- QUIZ SCREEN -->
    <div id="quizScreen" class="screen">

        <div class="top-bar">
            <div class="progress" id="progress">
                Question 1 / 15
            </div>

            <div class="score" id="score">
                XP: 0
            </div>
        </div>

        <div class="timer-box">

            <div class="timer-text">
                <span>Time</span>
                <span id="timer" class="timer">25</span>
            </div>

            <div class="timer-bar">
                <div id="timerFill" class="timer-fill"></div>
            </div>

        </div>

        <div id="question"></div>

        <div id="options" class="options"></div>

        <div id="feedback" class="feedback"></div>

        <button id="nextBtn" class="next-btn" onclick="nextQuestion()">
            Next Question →
        </button>

    </div>


    <!-- RESULT SCREEN -->
    <div id="resultScreen" class="screen result-screen">

        <h1>Quiz Complete!</h1>

        <div id="resultScore" class="result-score">
            0 / 15
        </div>

        <div id="resultMessage" class="result-message"></div>

        <button class="restart-btn" onclick="restartQuiz()">
            Try Again
        </button>

    </div>

</div>


<script>

const questions = [

    {
        question: "Which function is used to load an image from a file in Pygame?",
        options: [
            "pygame.image.load()",
            "pygame.image.open()",
            "pygame.load.image()",
            "pygame.load()"
        ],
        answer: 0
    },

    {
        question: "What does this line do?",
        code: `player_image = pygame.image.load("player.png")`,
        options: [
            "Loads player.png into player_image",
            "Displays player.png on the screen",
            "Resizes player.png",
            "Creates a new Pygame window"
        ],
        answer: 0
    },

    {
        question: "Which function is used to resize an image in Pygame?",
        options: [
            "pygame.image.resize()",
            "pygame.transform.scale()",
            "pygame.resize.image()",
            "pygame.image.scale()"
        ],
        answer: 1
    },

    {
        question: "What is the purpose of pygame.transform.scale()?",
        options: [
            "It loads an image from a file",
            "It displays an image on the screen",
            "It changes the width and height of an image",
            "It creates the game window"
        ],
        answer: 2
    },

    {
        question: "What does this line create?",
        code: `player_image = pygame.image.load("player.png")
player_image = pygame.transform.scale(player_image, (100, 100))`,
        options: [
            "A 100 × 100 resized version of the image",
            "A 100 × 100 game window",
            "An image with 100 frames",
            "A copy of the image at its original size"
        ],
        answer: 0
    },

    {
        question: "Which function is used to display an image on a Pygame Surface?",
        options: [
            "gamescreen.show()",
            "gamescreen.image()",
            "gamescreen.blit()",
            "pygame.display.image()"
        ],
        answer: 2
    },

    {
        question: "What does the following line do?",
        code: `gamescreen.blit(player_image, (100, 150))`,
        options: [
            "Loads player_image from the computer",
            "Displays player_image at position (100, 150)",
            "Resizes player_image to 100 × 150",
            "Moves the game window to (100, 150)"
        ],
        answer: 1
    },

    {
        question: "Which sequence correctly loads, resizes and displays an image?",
        options: [
            `load → scale → blit`,
            `scale → load → blit`,
            `blit → load → scale`,
            `load → blit → scale`
        ],
        answer: 0
    },

    {
        question: "What is the correct code to load an image named enemy.png?",
        options: [
            `enemy = pygame.image.load("enemy.png")`,
            `enemy = pygame.image.open("enemy.png")`,
            `enemy = pygame.load.image("enemy.png")`,
            `enemy = pygame.image("enemy.png")`
        ],
        answer: 0
    },

    {
        question: "Which code correctly resizes enemy to 80 × 80 pixels?",
        options: [
            `enemy = pygame.transform.scale(enemy, (80, 80))`,
            `enemy = pygame.image.scale(enemy, (80, 80))`,
            `enemy = pygame.transform.resize(enemy, 80, 80)`,
            `enemy.scale((80, 80))`
        ],
        answer: 0
    },

    {
        question: "Find the problem in this code:",
        code: `player = pygame.image.load("player.png")
gamescreen.blit(player, (200, 100))
player = pygame.transform.scale(player, (100, 100))`,
        options: [
            "The image is resized after it has already been displayed",
            "The image was loaded before pygame.init()",
            "blit() cannot display images",
            "The position (200, 100) is invalid"
        ],
        answer: 0
    },

    {
        question: "What will this code display?",
        code: `coin = pygame.image.load("coin.png")
coin = pygame.transform.scale(coin, (50, 50))
gamescreen.blit(coin, (300, 200))`,
        options: [
            "The coin image at 50 × 50 pixels at position (300, 200)",
            "The coin image at 300 × 200 pixels",
            "The coin image at its original size at (50, 50)",
            "Nothing because scale() cannot be used with images"
        ],
        answer: 0
    },

    {
        question: "Which code correctly combines loading and resizing an image?",
        options: [
            `image = pygame.transform.scale(
    pygame.image.load("hero.png"),
    (120, 120)
)`,
            `image = pygame.image.load(
    pygame.transform.scale("hero.png"),
    (120, 120)
)`,
            `image = pygame.transform.scale(
    "hero.png",
    (120, 120)
)`,
            `image = pygame.image.load("hero.png", (120, 120))`
        ],
        answer: 0
    },

    {
        question: "A student wants to display a resized image. Which code has the correct order?",
        code: `image = pygame.image.load("tree.png")

# Step 2
____________________________

# Step 3
gamescreen.blit(image, (200, 100))`,
        options: [
            `image = pygame.transform.scale(image, (150, 150))`,
            `image = pygame.image.load("tree.png")`,
            `image = gamescreen.blit(image, (150, 150))`,
            `image = pygame.transform.scale("tree.png", (150, 150))`
        ],
        answer: 0
    },

    {
        question: "What is the final result of this code?",
        code: `hero = pygame.image.load("hero.png")

hero = pygame.transform.scale(hero, (100, 120))

gamescreen.blit(hero, (250, 180))`,
        options: [
            "hero is loaded, resized to 100 × 120, then displayed at (250, 180)",
            "hero is loaded, displayed at (100, 120), then moved to (250, 180)",
            "hero is resized to 250 × 180 and displayed",
            "hero is loaded but never displayed"
        ],
        answer: 0
    }

];


let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 25;
let answered = false;


function startQuiz() {

    document.getElementById("startScreen").classList.remove("active");
    document.getElementById("quizScreen").classList.add("active");

    currentQuestion = 0;
    score = 0;

    showQuestion();
}


function showQuestion() {

    clearInterval(timer);

    answered = false;
    timeLeft = 25;

    const q = questions[currentQuestion];

    document.getElementById("progress").textContent =
        `Question ${currentQuestion + 1} / ${questions.length}`;

    document.getElementById("score").textContent =
        `XP: ${score}`;

    const questionBox = document.getElementById("question");

    questionBox.innerHTML = "";

    const questionText = document.createElement("div");
    questionText.className = "question";
    questionText.textContent = q.question;

    questionBox.appendChild(questionText);


    if (q.code) {

        const codeBox = document.createElement("div");

        codeBox.className = "code";
        codeBox.textContent = q.code;

        questionBox.appendChild(codeBox);
    }


    const optionsBox = document.getElementById("options");

    optionsBox.innerHTML = "";


    q.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";
        button.textContent = option;

        button.onclick = () => selectAnswer(index, button);

        optionsBox.appendChild(button);
    });


    document.getElementById("feedback").style.display = "none";

    document.getElementById("nextBtn").style.display = "none";


    updateTimer();

    timer = setInterval(() => {

        timeLeft--;

        updateTimer();

        if (timeLeft <= 0) {

            clearInterval(timer);

            if (!answered) {

                timeUp();
            }
        }

    }, 1000);
}


function updateTimer() {

    const timerText = document.getElementById("timer");
    const timerFill = document.getElementById("timerFill");

    timerText.textContent = timeLeft;

    timerFill.style.width =
        (timeLeft / 25 * 100) + "%";


    if (timeLeft <= 7) {

        timerText.classList.add("danger");
        timerFill.classList.add("danger");

    } else {

        timerText.classList.remove("danger");
        timerFill.classList.remove("danger");
    }
}


function selectAnswer(selected, button) {

    if (answered) return;

    answered = true;

    clearInterval(timer);

    const q = questions[currentQuestion];

    const allButtons =
        document.querySelectorAll(".option");


    allButtons.forEach((btn, index) => {

        btn.disabled = true;

        if (index === q.answer) {

            btn.classList.add("correct");
        }

    });


    if (selected === q.answer) {

        button.classList.add("correct");

        score += 100;

        showFeedback(
            "Correct! You understand this part of working with images in Pygame."
        );

    } else {

        button.classList.add("wrong");

        showFeedback(
            "The correct answer is: " + q.options[q.answer]
        );
    }


    document.getElementById("score").textContent =
        `XP: ${score}`;

    document.getElementById("nextBtn").style.display =
        "inline-block";
}


function timeUp() {

    answered = true;

    const q = questions[currentQuestion];

    const allButtons =
        document.querySelectorAll(".option");


    allButtons.forEach((btn, index) => {

        btn.disabled = true;

        if (index === q.answer) {

            btn.classList.add("correct");
        }
    });


    showFeedback(
        "Time's up! The correct answer is: " +
        q.options[q.answer]
    );

    document.getElementById("nextBtn").style.display =
        "inline-block";
}


function showFeedback(message) {

    const feedback =
        document.getElementById("feedback");

    feedback.textContent = message;

    feedback.style.display = "block";
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        showResult();

    } else {

        showQuestion();
    }
}


function showResult() {

    clearInterval(timer);

    document.getElementById("quizScreen")
        .classList.remove("active");

    document.getElementById("resultScreen")
        .classList.add("active");


    const correctAnswers = score / 100;

    document.getElementById("resultScore").textContent =
        `${correctAnswers} / ${questions.length}`;


    let message = "";

    if (correctAnswers === 15) {

        message = "Image Master! You know how to load, resize and display Pygame images.";

    } else if (correctAnswers >= 12) {

        message = "Excellent! You have a strong understanding of Pygame images.";

    } else if (correctAnswers >= 9) {

        message = "Good work! Review the order of load → scale → blit.";

    } else if (correctAnswers >= 6) {

        message = "Keep practicing the three main image operations.";

    } else {

        message = "Review pygame.image.load(), pygame.transform.scale() and blit().";
    }


    document.getElementById("resultMessage").textContent =
        message;
}


function restartQuiz() {

    document.getElementById("resultScreen")
        .classList.remove("active");

    document.getElementById("quizScreen")
        .classList.add("active");

    currentQuestion = 0;
    score = 0;

    showQuestion();
}

</script>

</body>
</html>
